<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">2notes product demo</title>
  <desc id="desc">A product demo mock showing quick capture, inbox, tags, status, and markdown export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="52%" stop-color="#eef6f3"/>
      <stop offset="100%" stop-color="#fff8ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 38px "Segoe UI", "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 400 18px "Segoe UI", "Noto Sans SC", sans-serif; fill: #516074; }
      .label { font: 700 15px "Segoe UI", "Noto Sans SC", sans-serif; fill: #3b4758; }
      .small { font: 400 13px "Segoe UI", "Noto Sans SC", sans-serif; fill: #657287; }
      .body { font: 400 15px "Segoe UI", "Noto Sans SC", sans-serif; fill: #263244; }
      .mono { font: 600 13px "Cascadia Code", "Consolas", monospace; fill: #425069; }
      .pill { font: 700 12px "Segoe UI", "Noto Sans SC", sans-serif; fill: #21443d; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <text class="title" x="70" y="72">2notes</text>
  <text class="subtitle" x="70" y="104">3 秒捕获，稍后澄清。一个本地优先的灵感与事务收集箱。</text>

  <g transform="translate(70 148)" filter="url(#shadow)">
    <rect width="760" height="480" rx="18" fill="#ffffff"/>
    <rect width="760" height="58" rx="18" fill="#172033"/>
    <rect y="40" width="760" height="18" fill="#172033"/>
    <circle cx="28" cy="29" r="7" fill="#ff6b6b"/>
    <circle cx="52" cy="29" r="7" fill="#ffd166"/>
    <circle cx="76" cy="29" r="7" fill="#50c878"/>
    <text class="mono" x="112" y="35" fill="#d8e1ee">2notes / main</text>

    <rect x="0" y="58" width="146" height="422" fill="#f5f7fa"/>
    <text class="label" x="24" y="96">收集箱</text>
    <text class="small" x="24" y="130">搜索</text>
    <text class="small" x="24" y="164">标签</text>
    <text class="small" x="24" y="198">回收站</text>
    <text class="small" x="24" y="232">设置</text>

    <rect x="170" y="86" width="350" height="36" rx="8" fill="#edf3f1"/>
    <text class="small" x="188" y="109">搜索标题、正文、原文或标签</text>
    <rect x="536" y="86" width="92" height="36" rx="8" fill="#e9eef8"/>
    <text class="small" x="554" y="109">全部类型</text>
    <rect x="644" y="86" width="82" height="36" rx="8" fill="#21443d"/>
    <text class="label" x="668" y="109" fill="#ffffff">记录</text>

    <rect x="170" y="146" width="248" height="86" rx="10" fill="#e8f4ef" stroke="#5da78e"/>
    <text class="body" x="190" y="176">整理 2notes 标签规则</text>
    <text class="small" x="190" y="202">#产品 #任务 · 待处理</text>

    <rect x="170" y="248" width="248" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="190" y="278">把会议里提到的链接存起来</text>
    <text class="small" x="190" y="304">#资料 · 未澄清</text>

    <rect x="170" y="350" width="248" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="190" y="380">想到一个新页面交互</text>
    <text class="small" x="190" y="406">#灵感 · 待处理</text>

    <rect x="448" y="146" width="278" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="label" x="472" y="180">整理 2notes 标签规则</text>
    <rect x="472" y="202" width="58" height="26" rx="13" fill="#ecfdf5"/>
    <text class="pill" x="488" y="220">任务</text>
    <rect x="540" y="202" width="70" height="26" rx="13" fill="#eef2ff"/>
    <text class="pill" x="556" y="220">待处理</text>
    <rect x="472" y="246" width="210" height="116" rx="8" fill="#f8fafc"/>
    <text class="body" x="490" y="278">先捕获，不强迫分类。</text>
    <text class="body" x="490" y="306">之后在收集箱里澄清、</text>
    <text class="body" x="490" y="334">打标签、归档或导出。</text>
    <text class="small" x="472" y="394">原始内容已保留，可随时追溯</text>
  </g>

  <g transform="translate(790 154)" filter="url(#shadow)">
    <rect width="330" height="190" rx="18" fill="#172033"/>
    <text class="label" x="26" y="38" fill="#f7fafc">快速记录</text>
    <text class="small" x="212" y="38" fill="#a7b4c8">草稿自动保存</text>
    <rect x="26" y="60" width="278" height="84" rx="10" fill="#ffffff"/>
    <text class="body" x="46" y="94">明天把导出 README 做漂亮一点</text>
    <text class="small" x="46" y="124">Enter 保存 · Esc 隐藏</text>
    <rect x="214" y="154" width="90" height="24" rx="12" fill="#68d391"/>
    <text class="pill" x="238" y="171">保存</text>
  </g>

  <g transform="translate(850 386)">
    <text class="label" x="0" y="0">Demo flow</text>
    <rect x="0" y="22" width="280" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="18" y="50">1. 快捷键呼出快速记录</text>
    <rect x="0" y="82" width="280" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="18" y="110">2. 自动进入收集箱</text>
    <rect x="0" y="142" width="280" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="18" y="170">3. 澄清类型、状态、标签</text>
    <rect x="0" y="202" width="280" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="body" x="18" y="230">4. 搜索、归档、Markdown 导出</text>
  </g>
</svg>
