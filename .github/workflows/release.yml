name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust audit tool
        run: cargo install cargo-audit --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/check-version.ps1 -Tag "${{ github.ref_name }}"

      - name: Check frontend format
        run: pnpm run format:check

      - name: Lint frontend
        run: pnpm run lint

      - name: Typecheck frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:unit

      - name: Build frontend
        run: pnpm run build

      - name: Audit frontend dependencies
        run: pnpm run audit:frontend

      - name: Check Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Audit Rust dependencies
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/cargo-audit-if-available.ps1

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "2notes ${{ github.ref_name }}"
          releaseBody: "2notes ${{ github.ref_name }} 发布"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
