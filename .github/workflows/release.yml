name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

# Release cannot be cancelled mid-run; subsequent pushes wait for the previous release to finish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-tauri:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri

      - name: Install Rust audit tool
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: cargo-audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/check-version.ps1 -Tag "$env:RELEASE_TAG"

      - name: Check frontend format
        run: pnpm run format:check

      - name: Lint frontend
        run: pnpm run lint

      - name: Typecheck frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:unit

      - name: Audit frontend dependencies
        run: pnpm run audit:frontend

      - name: Check Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Audit Rust dependencies
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/cargo-audit-if-available.ps1

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "2notes ${{ inputs.tag || github.ref_name }}"
          releaseBody: "2notes ${{ inputs.tag || github.ref_name }} 发布"
          # Draft first so the release is only published after the installed
          # package smoke test passes; otherwise a broken installer ships.
          releaseDraft: true
          prerelease: false
          args: "--bundles nsis"

      - name: Upload release checksums
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $bundleDir = "src-tauri\target\release\bundle\nsis"
          $checksums = Get-ChildItem -LiteralPath $bundleDir -File -Filter "*.exe" |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          if ($checksums.Count -eq 0) {
            throw "No NSIS installers found for checksum generation"
          }
          $checksumPath = Join-Path $bundleDir "SHA256SUMS.txt"
          Set-Content -LiteralPath $checksumPath -Value $checksums -Encoding ascii
          gh release upload $env:RELEASE_TAG $checksumPath --clobber

      - name: Upload draft NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: draft-nsis-installer
          path: src-tauri/target/release/bundle/nsis/2notes_*_x64-setup.exe
          if-no-files-found: error

  verify-installed-nsis:
    needs: build-tauri
    # This runner must be a standard-user, interactive Windows desktop (WinSta0),
    # not a service/Session 0 runner. GitHub-hosted Windows Server verifies builds
    # but does not promise a WebView2/CDP-capable GUI session.
    runs-on: [self-hosted, windows, interactive]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: draft-nsis-installer
          path: .tmp/release-nsis
      - name: Smoke test installed NSIS package
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $installer = @(
            Get-ChildItem -LiteralPath ".tmp\release-nsis" -File `
              -Filter "2notes_$version`_x64-setup.exe"
          )
          if ($installer.Count -ne 1) {
            throw "Expected one NSIS installer for $env:RELEASE_TAG, found $($installer.Count)"
          }
          Write-Output "SMOKE_INSTALLER=$($installer[0].FullName)"
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/installed-nsis-smoke.ps1 `
            -InstallerPath $installer[0].FullName `
            -EvidenceRoot ".tmp\ci-nsis-smoke" `
            -KeepArtifacts
          if ($LASTEXITCODE -ne 0) {
            throw "Installed NSIS smoke test failed with exit code $LASTEXITCODE"
          }
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-smoke-evidence
          path: .tmp/ci-nsis-smoke/
          if-no-files-found: ignore

  publish-release:
    needs: verify-installed-nsis
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Publish release after verification
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false
          Write-Output "PUBLISHED=$env:RELEASE_TAG"
