name: ci

on:
  push:
    # Branch pushes only; tag pushes go through release.yml, so a version tag
    # does not re-run the full verification suite a second time.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run build
      - run: pnpm run audit:frontend
      # Seconds-cost self-tests keep the release-only E2E runner helpers honest
      # on every push instead of only at release time.
      - name: Self-test NSIS main smoke runner
        run: node scripts/test/installed-nsis-main-smoke.mjs --self-test
      - name: Self-test NSIS child-process helpers
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/installed-nsis-smoke.ps1 -ChildProcessSelfTest
      - name: Test NSIS evidence generator
        run: python -m unittest scripts/test/test_installed_nsis_evidence.py

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: cargo-audit
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/check-tauri-capabilities.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/check-tauri-command-guards.ps1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/cargo-audit-if-available.ps1

  tauri-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build
      # Cheapest real-UI guard: launch the built source EXE over CDP and drive a
      # quick capture end to end. Catches startup crashes and main-window JS
      # errors that unit tests cannot, without waiting for a release.
      - name: Smoke test source build via CDP
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/2notes-quick-capture-cdp.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Quick-capture CDP smoke failed with exit code $LASTEXITCODE"
          }
