name: performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-scale:
    name: Release scale checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.1
      - name: Run block-document release-scale checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/block-document-scale.ps1
      # Together with the block-document script above, these two cover all eight
      # #[ignore] release-scale tests. Same job so the release build is reused.
      - name: Run knowledge release-scale checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/knowledge-scale.ps1
